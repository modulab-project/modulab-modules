name: "my-places"
version: "0.1.7"
display_name:
  en: "My Places"
  de: "Meine Orte"
description: "Save and explore your favourite places — restaurants, beaches, hotels, sights and more — on an interactive map"
icon: "ti-map-pin"
author: "modulab-project"
license: "AGPL-3.0"
category: "lifestyle"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "30s"

storage:
  quota: "5g"

credentials:
  - key: "maptiler_api_key"
    label:
      en: "Maptiler API Key"
      de: "Maptiler API-Key"
    description:
      en: "Get a free key at maptiler.com — required to display the map."
      de: "Kostenlosen Key auf maptiler.com erstellen — wird für die Karte benötigt."
    required: true
