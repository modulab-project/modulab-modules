name: "my-places"
version: "0.1.16"
display_name:
  en: "My Places"
  de: "Meine Orte"
  fr: "Mes lieux"
  es: "Mis lugares"
  nl: "Mijn plekken"
description:
  en: "Save and explore your favourite places — restaurants, beaches, hotels, sights and more — on an interactive map"
  de: "Speichere und entdecke deine Lieblingsorte — Restaurants, Strände, Hotels, Sehenswürdigkeiten und mehr — auf einer interaktiven Karte"
  es: "Guarda y descubre tus lugares favoritos — restaurantes, playas, hoteles, lugares de interés y más — en un mapa interactivo"
  fr: "Enregistrez et découvrez vos endroits préférés — restaurants, plages, hôtels, sites touristiques et plus encore — sur une carte interactive"
  nl: "Bewaar en ontdek je favoriete plekken — restaurants, stranden, hotels, bezienswaardigheden en meer — op een interactieve kaart"
icon: "ti-map-pin"
author: "modulab-project"
license: "AGPL-3.0"
category: "lifestyle"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "30s"

storage:
  quota: "5g"

credentials:
  - key: "maptiler_api_key"
    label:
      en: "Maptiler API Key"
      de: "Maptiler API-Key"
    description:
      en: "Get a free key at maptiler.com — required to display the map."
      de: "Kostenlosen Key auf maptiler.com erstellen — wird für die Karte benötigt."
    required: true
