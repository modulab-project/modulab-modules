name: "unifi-network"
version: "0.3.2"
display_name:
  en: "UniFi Network"
  de: "UniFi Netzwerk"
description: "Manage RADIUS-based MAC authentication, dynamic VLAN assignment, and live connection status across multiple independent UniFi gateways"
icon: "ti-router"
author: "modulab-project"
license: "AGPL-3.0"
category: "network"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "20s"

storage:
  quota: "1g"

# Kein credentials-Block: Gateway-API-Keys werden vom Modul selbst in einer
# eigenen `gateways`-Tabelle verwaltet (AES-256-GCM verschlüsselt), nicht über
# den Core-credentials-Mechanismus. Siehe Entscheidungsvorlage Abschnitt 2.

# Dynamische Netzwerk-Erlaubnis: Gateway-URLs werden vom Nutzer zur Laufzeit
# angelegt, eine statische egress_allowlist kann das zum Installationszeitpunkt
# nicht abbilden — deshalb bleibt sie hier leer (= kein Netzzugriff, bis der
# erste Gateway angelegt wird). Core unterstützt bewusst KEIN "*"-Sentinel
# für "beliebiger Host": das würde die OS-Sandbox faktisch abschalten und nur
# noch auf isPrivateHost() (Anwendungslogik im Handler, s.u.) als einzige
# Schranke setzen — eine Kontrolle, die sich selbst absichern soll, ist keine
# zweite Verteidigungslinie mehr.
#
# Stattdessen ruft der Handler bei jedem Gateway-Create/Update/Delete
# computeEgressHosts() auf (handlers/index.ts) und hängt das Ergebnis als
# HandlerResponse.restartHosts an die Antwort. Core (router.go) sieht dieses
# Feld nach dem Dispatch und startet den Worker mit --allow-net neu, scoped
# auf genau die Hostnamen, die aktuell als Gateway in der DB stehen. Der
# Worker hat also nie mehr Netzzugriff als "die Gateways, die gerade
# existieren" — ein gelöschtes Gateway verliert seinen Netzzugriff mit dem
# nächsten Reload wieder.
#
# isPrivateHost() in handlers/unifi-client.ts bleibt als zweite, unabhängige
# Prüfung bestehen: selbst wenn computeEgressHosts() je einen falschen Host
# liefern würde, verweigert der Handler selbst den Kontakt zu Nicht-privaten
# Zielen. Siehe Entscheidungsvorlage Abschnitt 1.2.
egress_allowlist: []

requested_scopes:
  - "Dieses Modul verbindet sich zu vom Nutzer konfigurierten UniFi-Gateways im lokalen Netzwerk. Der Netzzugriff wird bei jeder Gateway-Änderung neu auf genau die konfigurierten Gateway-Adressen beschränkt (durchgesetzt vom Betriebssystem, nicht nur durch Anwendungslogik)."

jobs:
  - name: "poll_gateways"
    schedule: "* * * * *"        # jede Minute; Cron-Format erlaubt kein Sub-Minuten-Intervall
    handler: "jobs/poll-gateways.ts"
    catch_up: false
