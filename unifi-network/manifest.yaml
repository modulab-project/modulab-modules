name: "unifi-network"
version: "0.3.11"
display_name:
  en: "UniFi Network"
  de: "UniFi Netzwerk"
description: "Manage RADIUS-based MAC authentication, dynamic VLAN assignment, and live connection status across multiple independent UniFi gateways"
icon: "ti-router"
author: "modulab-project"
license: "AGPL-3.0"
category: "network"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "20s"

storage:
  quota: "1g"

# Kein credentials-Block: Gateway-API-Keys werden vom Modul selbst in einer
# eigenen `gateways`-Tabelle verwaltet (AES-256-GCM verschlüsselt), nicht über
# den Core-credentials-Mechanismus. Siehe Entscheidungsvorlage Abschnitt 2.

# Dynamische Netzwerk-Erlaubnis: Gateway-URLs werden vom Nutzer zur Laufzeit
# angelegt, eine statische egress_allowlist kann das zum Installationszeitpunkt
# nicht abbilden — deshalb bleibt sie hier leer (= kein Netzzugriff, bis der
# erste Gateway angelegt wird). Core unterstützt bewusst KEIN "*"-Sentinel
# für "beliebiger Host": das würde die OS-Sandbox faktisch abschalten und nur
# noch auf isPrivateHost() (Anwendungslogik im Handler, s.u.) als einzige
# Schranke setzen — eine Kontrolle, die sich selbst absichern soll, ist keine
# zweite Verteidigungslinie mehr.
#
# Stattdessen ruft der Handler bei jedem Gateway-Create/Update/Delete
# computeEgressHosts() auf (handlers/index.ts) und hängt das Ergebnis als
# HandlerResponse.restartHosts an die Antwort. Core (router.go) sieht dieses
# Feld nach dem Dispatch und startet den Worker mit --allow-net neu, scoped
# auf genau die Hostnamen, die aktuell als Gateway in der DB stehen. Der
# Worker hat also nie mehr Netzzugriff als "die Gateways, die gerade
# existieren" — ein gelöschtes Gateway verliert seinen Netzzugriff mit dem
# nächsten Reload wieder.
#
# isPrivateHost() in handlers/unifi-client.ts bleibt als zweite, unabhängige
# Prüfung bestehen: selbst wenn computeEgressHosts() je einen falschen Host
# liefern würde, verweigert der Handler selbst den Kontakt zu Nicht-privaten
# Zielen. Siehe Entscheidungsvorlage Abschnitt 1.2.
egress_allowlist: []

# dynamic_egress: true weist Core an, bei einem Modul-Code-Update (nicht bei
# ReloadEgress selbst) die aktuell laufenden Egress-Hosts des Workers zu
# übernehmen statt sie auf egress_allowlist (bewusst leer, s.o.) zurückzusetzen
# — sonst würde jedes Modul-Update alle konfigurierten Gateways bis zum
# nächsten manuellen Speichern unerreichbar machen (gefunden 2026-07-02/03).
# Ohne dieses Flag könnte Core nicht unterscheiden, ob vom Manifest
# abweichende Runtime-Hosts absichtlich erhalten bleiben sollen (dieser Fall)
# oder ob ein Manifest-Autor Hosts bewusst entfernt hat (recipes-Fall, s.
# modulab-core backend/internal/modules/installer.go, Manifest.DynamicEgress).
dynamic_egress: true

# egress_hosts_handler schließt eine Lücke, die dynamic_egress allein NICHT
# abdeckt: dynamic_egress hilft nur, wenn beim Neustart bereits ein
# laufender Worker existiert, dessen aktuelle Hosts Core übernehmen kann
# (Modul-Update-Fall). Bei einem Core-eigenen Prozess-Neustart (z. B. durch
# das Nutzer-Skript update_build) gibt es keinen laufenden Worker zu fragen —
# Core startete den Worker bislang in diesem Fall immer nur mit
# egress_allowlist (bewusst leer, s. o.), wodurch alle konfigurierten
# Gateways bis zum nächsten manuellen Speichern unerreichbar wurden
# (NotCapable-Fehler in poll_gateways, gefunden 2026-07-03).
#
# Mit egress_hosts_handler ruft Core den hier referenzierten Job
# (jobs/compute-egress-hosts.ts) unmittelbar nach jedem Worker-Start auf
# (Install, Update UND Core-Neustart) und lädt die Egress-Liste mit dem
# Ergebnis neu — das Modul beantwortet also selbst "welche Hosts brauche ich
# gerade", direkt aus seiner eigenen DB (gateways-Tabelle), statt dass Core
# einen zuletzt-bekannten Stand zwischenspeichern müsste, der veralten
# könnte.
egress_hosts_handler: "jobs/compute-egress-hosts.ts"

# Gateways werden per privater IP konfiguriert, nicht per Hostname (Stand
# 2026-07-02, siehe unifi-client.ts isPrivateHost()/unifiFetch()). Ein
# Controller, der nur unter einer privaten IP erreichbar ist, hat keine
# öffentliche Domain, gegen die ein CA-Zertifikat (z. B. Let's Encrypt)
# ausgestellt werden könnte — sein eigenes (selbstsigniertes oder
# private-CA-)Zertifikat besteht Denos Standard-TLS-Prüfung deshalb nie.
# tls_skip_verify scoped Denos --unsafely-ignore-certificate-errors (Core,
# deno.go) auf exakt dieselbe Host-Liste wie egress_allowlist/restartHosts —
# kein prozessweites Abschalten der Zertifikatsprüfung, nur für Hosts, die
# ohnehin schon per --allow-net freigegeben sind. isPrivateHost() bleibt die
# eigentliche Schranke: sie wird bei jedem Request neu geprüft und
# verweigert den Kontakt zu allem außerhalb privater IP-Bereiche.
tls_skip_verify: true

requested_scopes:
  - "Dieses Modul verbindet sich zu vom Nutzer konfigurierten UniFi-Gateways im lokalen Netzwerk. Der Netzzugriff wird bei jeder Gateway-Änderung neu auf genau die konfigurierten Gateway-Adressen beschränkt (durchgesetzt vom Betriebssystem, nicht nur durch Anwendungslogik)."

jobs:
  - name: "poll_gateways"
    schedule: "* * * * *"        # jede Minute; Cron-Format erlaubt kein Sub-Minuten-Intervall
    handler: "jobs/poll-gateways.ts"
    catch_up: false
