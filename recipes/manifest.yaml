name: "recipes"
version: "0.3.16"
display_name:
  en: "Recipes"
  de: "Rezepte"
  fr: "Recettes"
  es: "Recetas"
  nl: "Recepten"
description: "Recipe collection with weekly meal plan"
icon: "ti-book-2"
author: "modulab-project"
license: "AGPL-3.0"
category: "productivity"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "30s"

storage:
  quota: "2g"

# URL import (fetch(url) with a user-supplied URL) was removed 2026-07-02 as
# part of the Core Deno sandbox hardening: an unrestricted-destination fetch
# is incompatible with a scoped --allow-net egress_allowlist.
#
# Open Food Facts nutrition lookup (world.openfoodfacts.org/api.openfoodfacts.org)
# was removed 2026-07-03: the /nutrition/search and /nutrition/:offId routes
# were never wired up to any UI (no autocomplete/search field ever called
# them), so this module now makes no outbound network calls at all. The
# portion calculator (/recipes/:id/nutrition) is unaffected — it only
# recalculates from ingredient rows already stored in the DB (manually
# entered kcal/protein/fat/carbs/fiber per 100g), no external call involved.
egress_allowlist: []

requested_scopes: []
