name: "recipes"
version: "0.4.7"
display_name:
  en: "Recipes"
  de: "Rezepte"
  fr: "Recettes"
  es: "Recetas"
  nl: "Recepten"
description:
  en: "Recipe collection with weekly meal plan"
  de: "Rezeptsammlung mit Wochenspeiseplan"
  es: "Colección de recetas con plan de comidas semanal"
  fr: "Collection de recettes avec planning de repas hebdomadaire"
  nl: "Receptenverzameling met wekelijks maaltijdplan"
icon: "ti-book-2"
author: "modulab-project"
license: "AGPL-3.0"
category: "productivity"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  # 60s (2026-07-12, up from 45s): a POST .../nutrition/ai call can involve
  # a slower reasoning model on the provider side; the in-module fetch
  # timeout (handlers/ai-providers.ts REQUEST_TIMEOUT_MS) is 55s, so this
  # needs headroom above that or Core/the reverse proxy cuts the request
  # before the module's own timeout/error handling ever gets to run —
  # which is what produced the bare, bodyless 502 seen in testing.
  timeout: "60s"

storage:
  quota: "2g"

# AI nutrition provider API keys are stored and encrypted entirely inside
# this module (own `ai_nutrition_providers` table, AES-256-GCM via
# MODULAB_ENCRYPTION_KEY in handlers/crypto.ts) — no credentials block,
# same reasoning as unifi-network's gateways table. These four hosts are
# fixed (unlike unifi-network's user-supplied gateway URLs), so a static
# allowlist is sufficient — no runtime restartHosts/computeEgressHosts
# mechanism needed.
egress_allowlist:
  - "api.openai.com"
  - "generativelanguage.googleapis.com"
  - "api.anthropic.com"
  - "api.deepseek.com"

requested_scopes: []
