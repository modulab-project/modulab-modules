name: "recipes"
version: "0.4.0"
display_name:
  en: "Recipes"
  de: "Rezepte"
  fr: "Recettes"
  es: "Recetas"
  nl: "Recepten"
description:
  en: "Recipe collection with weekly meal plan"
  de: "Rezeptsammlung mit Wochenspeiseplan"
  es: "Colección de recetas con plan de comidas semanal"
  fr: "Collection de recettes avec planning de repas hebdomadaire"
  nl: "Receptenverzameling met wekelijks maaltijdplan"
icon: "ti-book-2"
author: "modulab-project"
license: "AGPL-3.0"
category: "productivity"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "45s"

storage:
  quota: "2g"

# AI nutrition provider API keys are stored and encrypted entirely inside
# this module (own `ai_nutrition_providers` table, AES-256-GCM via
# MODULAB_ENCRYPTION_KEY in handlers/crypto.ts) — no credentials block,
# same reasoning as unifi-network's gateways table. These four hosts are
# fixed (unlike unifi-network's user-supplied gateway URLs), so a static
# allowlist is sufficient — no runtime restartHosts/computeEgressHosts
# mechanism needed.
egress_allowlist:
  - "api.openai.com"
  - "generativelanguage.googleapis.com"
  - "api.anthropic.com"
  - "api.deepseek.com"

requested_scopes: []
