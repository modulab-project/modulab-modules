name: "recipes"
version: "0.1.6"
description: "Recipe collection with weekly meal plan, nutrition info, and URL import"
author: "modulab-project"
license: "AGPL-3.0"
category: "productivity"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "30s"

storage:
  quota: "2g"

egress_allowlist:
  - "world.openfoodfacts.org"   # Nährwert-Lookup
  - "api.openfoodfacts.org"     # Nährwert-Lookup (alt. Endpoint)

requested_scopes:
  - "Nutrition data is fetched from Open Food Facts (world.openfoodfacts.org)"
  - "Recipe URLs are fetched during import (domain determined at runtime)"
