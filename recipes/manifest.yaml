name: "recipes"
version: "0.3.5"
display_name:
  en: "Recipes"
  de: "Rezepte"
description: "Recipe collection with weekly meal plan and nutrition info"
icon: "ti-book-2"
author: "modulab-project"
license: "AGPL-3.0"
category: "productivity"
min_core_api: "v1"
min_core_ui: "v1"
tier: 2
scope: "per-location"
startup: "eager"

handler: "handlers/index.ts"

resources:
  memory: "256m"
  timeout: "30s"

storage:
  quota: "2g"

# URL import (fetch(url) with a user-supplied URL) was removed 2026-07-02 as
# part of the Core Deno sandbox hardening: an unrestricted-destination fetch
# is incompatible with a scoped --allow-net egress_allowlist. Nutrition
# lookup is the only remaining outbound call this module makes, to a fixed
# host — see backend/internal/modules/deno.go (WorkerOptions) for how this
# list becomes the worker's --allow-net grant.
egress_allowlist:
  - "world.openfoodfacts.org"   # Nährwert-Lookup
  - "api.openfoodfacts.org"     # Nährwert-Lookup (alt. Endpoint)

requested_scopes:
  - "Nutrition data is fetched from Open Food Facts (world.openfoodfacts.org)"
